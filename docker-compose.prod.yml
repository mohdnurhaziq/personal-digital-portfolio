# Production-shaped stack: assets are baked into the image, nginx serves them,
# and the SSR renderer runs under supervisor alongside php-fpm.
#
# Run it locally to check the thing you are actually going to deploy:
#   docker compose -f docker-compose.prod.yml up --build

services:
  app:
    build:
      context: .
      target: prod
    ports:
      - '${APP_PORT:-8080}:80'
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      # Media Library builds absolute URLs from this. Set it to the address the
      # site is actually served on or every uploaded image 404s.
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-portfolio}
      DB_USERNAME: ${DB_USERNAME:-portfolio}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      # Uploaded photos must outlive the container.
      - storage-data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portfolio}
      MYSQL_USER: ${DB_USERNAME:-portfolio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-secret}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  db-data:
  storage-data:
